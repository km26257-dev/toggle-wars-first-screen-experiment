<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Screen Experiment Demo</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body {
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .toolbar, .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      padding: 0.55rem 0.95rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #e0e7ff;
      color: #1e40af;
    }
    .sample-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .sample-item {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.85rem;
      background: #f8fafc;
    }
    .blank-box {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      color: #64748b;
      margin: 1rem 0;
    }
    .status {
      font-size: 0.9rem;
      color: #334155;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <h1>First Screen Mode Experiment</h1>
  <div class="toolbar">
    <div class="row">
      <label for="userId"><strong>User ID:</strong></label>
      <input id="userId" value="demo_user_1" />
      <button id="loadBtn">Load First Screen</button>
      <button id="randomBtn">Random User</button>
    </div>
    <p class="status" id="meta">Evaluate <code>first_screen_mode</code> to view assigned variant.</p>
  </div>

  <div class="card" id="screenCard" hidden>
    <span class="badge" id="variantBadge"></span>
    <h2 id="headline"></h2>
    <p id="subtitle"></p>
    <div id="contentArea"></div>
    <button class="primary" id="mainActionBtn"></button>
    <p class="status" id="trackStatus"></p>
  </div>

  <script>
    let currentDecision = null;

    async function loadScreen() {
      const userId = document.getElementById("userId").value.trim() || "demo_user_1";
      document.getElementById("trackStatus").textContent = "";
      const res = await fetch(`/api/screen?user_id=${encodeURIComponent(userId)}`);
      const data = await res.json();
      currentDecision = data.decision;
      const screen = data.screen;

      document.getElementById("meta").textContent =
        `User: ${currentDecision.user_id} | Mode: ${currentDecision.mode} | Variant: ${currentDecision.variant ?? "none"} | In experiment: ${currentDecision.in_experiment}`;
      document.getElementById("variantBadge").textContent = `mode: ${screen.mode}`;
      document.getElementById("headline").textContent = screen.headline;
      document.getElementById("subtitle").textContent = screen.subtitle;
      document.getElementById("mainActionBtn").textContent = screen.cta_label;

      const area = document.getElementById("contentArea");
      area.innerHTML = "";
      if (screen.items.length > 0) {
        const grid = document.createElement("div");
        grid.className = "sample-grid";
        for (const item of screen.items) {
          const card = document.createElement("div");
          card.className = "sample-item";
          card.innerHTML = `<strong>${item.title}</strong><div>Status: ${item.status}</div>`;
          grid.appendChild(card);
        }
        area.appendChild(grid);
      } else {
        const blank = document.createElement("div");
        blank.className = "blank-box";
        blank.textContent = "No items yet — clean blank starting state.";
        area.appendChild(blank);
      }

      document.getElementById("screenCard").hidden = false;
    }

    async function trackMainAction() {
      if (!currentDecision) return;
      const res = await fetch("/api/track", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: currentDecision.user_id,
          mode: currentDecision.mode,
        }),
      });
      const result = await res.json();
      document.getElementById("trackStatus").textContent =
        `Tracked event "${result.tracked}" for ${result.user_id} (${result.mode}).`;
    }

    document.getElementById("loadBtn").addEventListener("click", loadScreen);
    document.getElementById("randomBtn").addEventListener("click", () => {
      document.getElementById("userId").value = `demo_user_${Math.floor(1000 + Math.random() * 9000)}`;
      loadScreen();
    });
    document.getElementById("mainActionBtn").addEventListener("click", trackMainAction);

    loadScreen();
  </script>
</body>
</html>
